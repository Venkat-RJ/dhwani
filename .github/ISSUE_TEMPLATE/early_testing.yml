name: Early testing
description: Volunteer to test Dhwani or share a session result using synthetic data.
title: "Early testing: "
body:
  - type: markdown
    attributes:
      value: "Download the Dhwani beta from https://venkat-rj.github.io/dhwani/ and read docs/EARLY-TESTING.md. This issue is public: do not include personal dictations, recordings, contact details, or private screenshots. Report vulnerabilities through SECURITY.md."
  - type: dropdown
    id: purpose
    attributes:
      label: How would you like to help?
      options:
        - Volunteer to test a packaged beta
        - Share a test session result
        - Get help building from source
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version, chip family, and speech language
      description: "For example: macOS 14.8, M1, English (India). Do not include serial numbers or personal device names."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App version or source commit, if already tested
  - type: textarea
    id: scope
    attributes:
      label: What would you like to test, or what did you try?
      description: "For a session report, include the destination app, microphone type, permission choices, and approximate capture duration."
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Results or questions
      description: "Separate passed, failed, and not-tested checks. Use synthetic examples. A short successful session does not establish long-capture reliability."
  - type: checkboxes
    id: privacy
    attributes:
      label: Before submitting
      options:
        - label: I have kept private recordings, dictations, credentials, and contact details out of this public report.
          required: true
