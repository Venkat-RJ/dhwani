name: Feature request
description: Explain the user problem and how you would verify an improvement.
title: "Feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the workflow and where it becomes difficult.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: verification
    attributes:
      label: How would you know it works?
      description: Include relevant privacy, accessibility, or destination constraints.
