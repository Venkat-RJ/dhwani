name: Bug report
description: Describe a reproducible problem using synthetic or redacted data.
title: "Bug: "
body:
  - type: markdown
    attributes:
      value: "For a security vulnerability, use SECURITY.md instead of a public issue. Do not include private dictations or recordings."
  - type: input
    id: version
    attributes:
      label: Commit or release
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version, hardware, and speech language
    validations:
      required: true
  - type: dropdown
    id: workflow
    attributes:
      label: Where did the problem happen?
      options:
        - Setup or shortcut
        - Recording or long capture
        - Recognition, language, or vocabulary
        - Pasting or recovering text
        - History or privacy controls
        - Build, install, or upgrade
  - type: input
    id: capture_conditions
    attributes:
      label: Capture conditions, if relevant
      description: "Give approximate speaking duration, time to final text, and microphone type (built-in, USB, Bluetooth, or loopback). Omit personal device names and private dictations."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include destination app and relevant permission or storage settings.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Redacted diagnostics and checks performed
      description: Explain whether this was a live capture, an isolated test, or source inspection.
  - type: dropdown
    id: verification_scope
    attributes:
      label: What did you verify?
      options:
        - Live app behavior
        - Isolated recording test
        - Startup or automated logic checks
        - Source inspection or build only
        - Not sure
