name: Build and checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build unsigned app
        run: >-
          xcodebuild -project "Lokaah Talky.xcodeproj"
          -scheme "Lokaah Talky" -configuration Release
          -destination "generic/platform=macOS"
          -derivedDataPath build/ci
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Unit checks
        run: ./test/run-unit-tests.sh
      - name: Product checks
        run: ./test/run-product-tests.sh
      - name: Mocked script checks
        run: python3 test/test-scripts.py
      - name: Benchmark evaluator checks
        run: python3 -I test/benchmarks/test_benchmark.py
      - name: Release tooling checks
        run: python3 -I test/test-release.py
      - name: Startup consumer checks
        run: python3 -I test/test-startup-smoke.py
      - name: Package test-only startup app
        env:
          TALKY_CI_COMMIT: ${{ github.sha }}
        run: >-
          python3 -I test/startup-smoke.py package
          --app "build/ci/Build/Products/Release/Lokaah Talky.app"
          --source "Lokaah Talky/LokaahTalkyApp.swift"
          --commit "$TALKY_CI_COMMIT" --output build/startup-artifact
      - name: Transfer startup test app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-test-app
          path: |
            build/startup-artifact/startup-test.zip
            build/startup-artifact/manifest.json
          if-no-files-found: error
          retention-days: 2

  startup:
    needs: macos
    strategy:
      fail-fast: false
      matrix:
        os: [14, 26]
    runs-on: macos-${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's startup app
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: startup-test-app
          path: build/startup-artifact
      - name: Launch app and read readiness without recording
        env:
          TALKY_CI_COMMIT: ${{ github.sha }}
          TALKY_CI_OS: ${{ matrix.os }}
        run: |
          talky_source_hash=$(shasum -a 256 "Lokaah Talky/LokaahTalkyApp.swift" | awk '{print $1}')
          python3 -I test/startup-smoke.py run --artifact-dir build/startup-artifact \
            --source-sha256 "$talky_source_hash" --commit "$TALKY_CI_COMMIT" \
            --os-major "$TALKY_CI_OS" --result build/startup-result.json
      - name: Save startup evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: startup-evidence-macos-${{ matrix.os }}
          path: build/startup-result.json
          if-no-files-found: error
          retention-days: 7

  video-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Audit locked public dependencies
        working-directory: video
        run: npm audit --package-lock-only --ignore-scripts
