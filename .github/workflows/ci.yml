name: Build and checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Show toolchain
        run: xcodebuild -version
      - name: Build unsigned app
        run: >-
          xcodebuild -project "Lokaah Talky.xcodeproj"
          -scheme "Lokaah Talky" -configuration Release
          -destination "generic/platform=macOS"
          -derivedDataPath build/ci
          ARCHS=arm64 ONLY_ACTIVE_ARCH=NO
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
      - name: Unit checks
        run: ./test/run-unit-tests.sh
      - name: Product checks
        run: ./test/run-product-tests.sh
      - name: Mocked script checks
        run: python3 test/test-scripts.py

  video-dependencies:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Audit locked public dependencies
        working-directory: video
        run: npm audit --package-lock-only --ignore-scripts
